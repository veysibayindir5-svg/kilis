  <style>
    /* Sayfa açılış animasyonlarını tamamen kaldır */

    *::before,

    html,

      animation-duration: 0s !important;

      transition-delay: 0s !important;
    }

    /* Root ve tüm alt elementler için */
    #root,
    #root *,
    body,
    body * {
      opacity: 1 !important;
      visibility: visible !important;
      transform: none !important;

  <script>
    // Loading ekranını anında gizle
    (function () {
      const hideLoading = () => {
        // Tüm muhtemel loading elementlerini bul
        const selectors = [
          '[class*="load"]', '[class*="Load"]', '[class*="LOAD"]',
          '[id*="load"]', '[id*="Load"]', '[id*="LOAD"]',
          '[class*="overlay"]', '[class*="Overlay"]',
          '[class*="splash"]', '[class*="Splash"]'
        ];

        selectors.forEach(selector => {
          try {
            const elements = document.querySelectorAll(selector);
            elements.forEach(el => {
              el.style.display = 'none !important';
              el.style.opacity = '0 !important';
              el.style.visibility = 'hidden !important';
              el.remove();
            });
          } catch (e) { }
        });

        // "GELİYOR" içeren tüm elementleri bul ve kaldır
        const allEls = document.querySelectorAll('*');
        allEls.forEach(el => {
          if (el.textContent && (el.textContent.includes('GELİYOR') || el.textContent.includes('GELIYOR'))) {
            const parent = el.parentElement;
            if (parent) {
              parent.style.display = 'none !important';
              parent.remove();
            }
            el.style.display = 'none !important';
            el.remove();
          }
        });
      };

      // Mümkün olan en erken zamanda çalıştır
      hideLoading();

      // DOMContentLoaded'da tekrar çalıştır
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hideLoading);
      }

      // Sürekli kontrol et (ilk 2 saniye)
      let attempts = 0;
      const interval = setInterval(() => {
        hideLoading();
        attempts++;
        if (attempts > 20) clearInterval(interval);
      }, 100);
    })();
  </script>
